name: PluginDeck

on:
  push:
    paths:
      - "Documents/codeXbyJK/PluginDeck/**"
      - ".github/workflows/plugindeck.yml"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Documents/codeXbyJK/PluginDeck
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Build
        run: swift build
      - name: Test
        run: swift test
