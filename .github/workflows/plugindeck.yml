name: PluginDeck

on:
  push:
    paths:
      - "Documents/codeXbyJK/PluginDeck/**"
      - ".github/workflows/plugindeck.yml"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Documents/codeXbyJK/PluginDeck
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Build
        run: swift build
      - name: Test
        env:
          PLUGINDECK_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: swift test
      - name: Upload skin snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skin-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
          retention-days: 14
